spring:
  datasource:
    url: jdbc:mysql://localhost:3306/tmsdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  flyway:
    enabled: false

logging:
  level:
    com.tms: DEBUG